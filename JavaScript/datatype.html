<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type</title>
</head>
<body>
    <script>
        // data type present in js is generic data type(generating)
        // var a = 100;
        // var a = 20;
        // document.write(a);
        let a = 150;
        var a = 30;
        const a = 34;
        document.write(a);
        // jiski time complexity kam uski priority jyada 
        // const > let > var (priority)
    </script>
</body>
</html>
