<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
</head>
<body>
    <script>
        const num = [11, 23, 34, 32, 41, 54, 89, 30, 9, 15];

        const even = num.filter((i) => i % 2 == 0);
        const squre = even.map((i) => i * i);

        console.log("Squre =", squre);

    </script>
    
</body>
</html>
