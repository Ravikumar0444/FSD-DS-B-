<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop</title>
</head>
<body>
    <script>
        // Code for (FOR LOOP)
        for(let i = 1;i<5;i++){
            document.write(i + "<br>");
        }
        const car = ['car1' , 'car2' , 'car3'];
        for(let i = 0;i<car.length;i++){
            document.write(car[i] + "<br>");
        }

    </script>
</body>
</html>
