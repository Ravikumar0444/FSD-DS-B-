<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUS BOOK</title>
</head>
<body>
    <center>
    <div style="background-color: violet; border: 2px solid red ; height : 600px ;width: 400px;">
        <center>
            <h1>Welcome Bus Booking System</h1>
        </center>
        <h3>User Information</h3>
        <p>Name:  <input type="text"></p>
        <p>Address: <select name="Select your city" id=""> 
            <option value="Gzb">Ghaziabad</option>
            <option value="Delhi">Delhi</option>
            <option value="Kanpur">Kanpur</option>
            <option value="Goa">Goa</option>
        </select></p>
        <p>User Age: <input type="text"></p>
        <p>User Adhar no. : <input type="text"></p>
        <br>
        <h3>Bus Booking Options</h3>
        <p>Select Bus Options: 
        <label>
        <input type="radio" name="bus" value="AC">
           AC
        </label>

        <label>
           <input type="radio" name="bus" value="NON AC">
           NON AC
        </label>
        </p>
        <p>Select your Seat <select name="" id="">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select></p>
        <button onclick="saveBooking()">Click for Save</button>
        </center>
    </div>
    <script>
        function saveBooking(){
            alert("Booking Saved Successfully")
        }
    </script>
</body>
</html>
